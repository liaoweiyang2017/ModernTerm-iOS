name: Android build and device tests
on:
  workflow_dispatch:
  push:
    paths: ['android/**', 'shared/**', '.github/workflows/android-ci.yml', 'Resources/palettes.json', 'Sources/ServerMetrics.swift']
  pull_request:
    paths: ['android/**', 'shared/**', '.github/workflows/android-ci.yml', 'Resources/palettes.json', 'Sources/ServerMetrics.swift']
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [29, 36]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Isolated SSH server
        run: |
          python3 -m venv /tmp/modernterm-fixture-env
          /tmp/modernterm-fixture-env/bin/pip install paramiko==4.0.0
          /tmp/modernterm-fixture-env/bin/python android/scripts/ssh_fixture.py > /tmp/modernterm-fixture.log 2>&1 &
          for i in $(seq 1 30); do test -f android/app/src/androidTest/assets/ssh-fixture.json && break; sleep 1; done
          test -f android/app/src/androidTest/assets/ssh-fixture.json
      - name: Build and test on Android ${{ matrix.api }}
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: cd android && ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug connectedDebugAndroidTest
      - name: Test reports and installable debug APK
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: modernterm-android-api-${{ matrix.api }}
          retention-days: 14
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
