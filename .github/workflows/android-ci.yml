name: Android build and device tests
on:
  workflow_dispatch:
  push:
    paths: ['android/**', 'shared/**', '.github/workflows/android-ci.yml', 'Resources/palettes.json', 'Sources/ServerMetrics.swift']
  pull_request:
    paths: ['android/**', 'shared/**', '.github/workflows/android-ci.yml', 'Resources/palettes.json', 'Sources/ServerMetrics.swift']
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [29, 36]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: 'android/**/*.gradle.kts'
      - name: Shared resource consistency
        run: python3 android/scripts/sync_shared.py --check
      - name: Compile and lint before booting emulator
        run: cd android && ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Isolated SSH server
        run: |
          python3 -m venv /tmp/modernterm-fixture-env
          /tmp/modernterm-fixture-env/bin/pip install paramiko==4.0.0
          /tmp/modernterm-fixture-env/bin/python android/scripts/ssh_fixture.py > /tmp/modernterm-fixture.log 2>&1 &
          for i in $(seq 1 30); do test -f android/app/src/androidTest/assets/ssh-fixture.json && break; sleep 1; done
          test -f android/app/src/androidTest/assets/ssh-fixture.json
      - name: Build and test on Android ${{ matrix.api }}
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          cores: 2
          disable-animations: true
          script: |
            adb shell dumpsys webviewupdate
            cd android && ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug connectedDebugAndroidTest
            mkdir -p android/app/build/reports/screenshots && adb pull /sdcard/Pictures/ModernTerm-tests android/app/build/reports/screenshots || true
      - name: Test summary (available even when artifact storage is full)
        if: always()
        run: python3 android/scripts/report_results.py
      - name: Test reports and installable debug APK
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: modernterm-android-api-${{ matrix.api }}
          retention-days: 14
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
  signed-apk:
    needs: emulator
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: 'android/**/*.gradle.kts'
      - name: Build installable release
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          MT_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_BASE64"
          export MT_STORE_FILE="$RUNNER_TEMP/modernterm-signing.jks"
          trap 'rm -f "$MT_STORE_FILE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$MT_STORE_FILE"
          chmod 600 "$MT_STORE_FILE"
          cd android
          ./gradlew --no-daemon assembleRelease
          sha256sum app/build/outputs/apk/release/*.apk > app/build/outputs/apk/release/SHA256SUMS.txt
      - name: Signed APK (artifact quota permitting)
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ModernTerm-Android-0.2.3
          retention-days: 14
          path: android/app/build/outputs/apk/release/
