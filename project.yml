name: ModerntermIOS
options:
  bundleIdPrefix: com.modernterm
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: 0.2.4
    CURRENT_PROJECT_VERSION: 7
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.18.0
  Citadel:
    path: Vendor/Citadel
  NIOSSH:
    path: Vendor/swift-nio-ssh
  NIO:
    url: https://github.com/apple/swift-nio
    from: 2.81.0
  Crypto:
    url: https://github.com/apple/swift-crypto
    from: 3.12.3
targets:
  ModerntermIOS:
    type: application
    platform: iOS
    sources: [Sources, Resources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.modernterm.ios
        INFOPLIST_KEY_CFBundleDisplayName: ModernTerm
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connect to your SSH servers on the local network.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: '1,2'
        SUPPORTS_MACCATALYST: NO
    info:
      path: Configuration/Info.plist
      properties:
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: ModernTerm encrypted connections
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [com.modernterm.archive]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.modernterm.archive
            UTTypeDescription: ModernTerm encrypted connections
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [term]
              public.mime-type: application/x-modernterm
    entitlements:
      path: Sources/ModernTerm.entitlements
      properties:
        application-identifier: $(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)
    dependencies:
      - package: SwiftTerm
      - package: Citadel
      - package: NIOSSH
        product: NIOSSH
      - package: NIO
        product: NIOCore
      - package: Crypto
        product: Crypto
      - package: Crypto
        product: _CryptoExtras
  ModerntermTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: shared/term-transfer
        excludes: ["*.py", "*.md"]
        buildPhase: resources
    dependencies:
      - target: ModerntermIOS
  ModerntermUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
      - path: shared/term-transfer/attachment.term
        buildPhase: resources
    dependencies:
      - target: ModerntermIOS
schemes:
  ModerntermIOS:
    build:
      targets:
        ModerntermIOS: all
        ModerntermTests: [test]
        ModerntermUITests: [test]
    test:
      targets: [ModerntermTests, ModerntermUITests]
