<!doctype html><html><head><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'none'; img-src 'none';"><link rel="stylesheet" href="xterm.css"><style>html,body,#terminal{margin:0;width:100%;height:100%;overflow:hidden;background:#17191d;-webkit-text-size-adjust:none;text-size-adjust:none} .xterm{height:100%;padding:4px;box-sizing:border-box}</style></head><body><div id="terminal"></div><script src="compat.js"></script><script src="xterm.js"></script><script src="fit.js"></script><script>
const term = new Terminal({cursorBlink:true,scrollback:2000,fontSize:13,fontFamily:'monospace',theme:{background:'#17191d',foreground:'#eceff4'},allowProposedApi:false});
const fit = new FitAddon.FitAddon(); term.loadAddon(fit); term.open(document.getElementById('terminal'));
term.onData(data=>Bridge.input(data)); term.onResize(size=>Bridge.resize(size.cols,size.rows));
let resizePending = false;
function resize(){
  if(resizePending)return;
  resizePending=true;
  requestAnimationFrame(()=>{resizePending=false;fit.fit()});
}
new ResizeObserver(resize).observe(document.body);
window.addEventListener('resize',resize);
if(window.visualViewport)window.visualViewport.addEventListener('resize',resize);
function feed(data){term.write(Uint8Array.from(atob(data),c=>c.charCodeAt(0)))}
function appearance(theme,size){term.options.theme=theme;term.options.fontSize=size;document.body.style.background=theme.background;resize()}
function focusInput(){term.focus();return document.activeElement===term.textarea}
term.parser.registerOscHandler(7,data=>{Bridge.directory(data);return true});
fit.fit(); Bridge.ready();
</script></body></html>
